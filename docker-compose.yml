services:
  postgres:
    image: postgres:16-alpine
    container_name: apex-telemetry-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: apex
      POSTGRES_DB: apex_telemetry
    ports:
      - '5432:5432'
    volumes:
      - apex-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U apex -d apex_telemetry']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  apex-pgdata:
